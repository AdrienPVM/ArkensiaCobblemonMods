plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    // Modrinth Maven resolves mod jars as ordinary Gradle dependencies, so a
    // clean clone builds with no manual downloads. Nothing third-party is
    // redistributed by this repository.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // CheeseDash — required dependency for dashboard integration
    modImplementation files("../CheeseDash/build/libs/cheesedash-1.0.0.jar")

    implementation 'com.google.code.gson:gson:2.10.1'

    // Cobblemon — compileOnly for Mixin targets (reflection-based at runtime)
    compileOnly "maven.modrinth:cobblemon:v77SHSXW" // Cobblemon 1.6.1 (fabric)
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
