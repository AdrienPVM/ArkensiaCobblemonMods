plugins {
    id 'fabric-loom' version '1.10.5'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    // Modrinth Maven resolves mod jars as ordinary Gradle dependencies, so a
    // clean clone builds with no manual downloads. Nothing third-party is
    // redistributed by this repository.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // sgui (Patbox)
    maven {
        name = 'Nucleoid'
        url = 'https://maven.nucleoid.xyz/'
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

// Fail fast with an actionable message rather than a wall of "cannot find symbol".
def ftbQuestsJar = file('../localdeps/ftb-quests-fabric-2101.1.13.jar')
def academyJar   = file('../localdeps/academy-mc1.21.1-v1.4.0+build.467-fabric.jar')

def missingLocal = [ftbQuestsJar, academyJar].findAll { !it.exists() }
if (!missingLocal.isEmpty()) {
    throw new GradleException("""
CheeseCompatModsFix cannot be built without these third-party jars.

Missing from localdeps/:
${missingLocal.collect { "  - " + it.name }.join('\n')}

FTB Quests and StarAcademy are CurseForge-exclusive — neither is on Modrinth nor
on any public Maven repository, so Gradle cannot download them for you. This mod
mixes into their classes, and the Mixin annotation processor validates every
target, so both are required to compile even where the mixin targets a class by
string name.

Download them from CurseForge (Fabric, 1.21.1) and drop them in localdeps/ with
exactly those filenames. Details: localdeps/README.md
""")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API — commands, events, networking
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Battle Tower + Cobblemon — modCompileOnly so Loom remaps intermediary->yarn for hierarchy resolution
    compileOnly "maven.modrinth:cobblemon-battle-tower-1-6-1:NRBIX8Ty" // Battle Tower 1.7.11+1.6.1 (fabric)
    compileOnly "maven.modrinth:cobblemon:v77SHSXW" // Cobblemon 1.6.1 (fabric)

    // Legendary Monuments — modCompileOnly so Loom remaps intermediary->yarn for hierarchy resolution
    modCompileOnly "maven.modrinth:legendary-monuments:oaBxuxgH" // Legendary Monuments 7.2

    // Minerally — for the OrePile mixin (JustHammers crash fix). Even though that
    // mixin targets the class by string name, the Mixin annotation processor still
    // validates the target, so the jar has to be on the compile classpath.
    modCompileOnly "maven.modrinth:minerally:wvK26f7w" // Minerally 1.21

    // CobbleSafari — modCompileOnly so Loom remaps intermediary for hierarchy resolution
    modCompileOnly "maven.modrinth:cobblesafari:XANyMPaV" // CobbleSafari 0.1.5 (fabric)

    // CobblemonTrialsEdition — for Natures static method bridge (Cobblemon 1.6.x compat)
    compileOnly "maven.modrinth:cobblemon-trials-edition:XdMo4HiB" // Trials Edition 1.2.2 (fabric)

    // CobblemonRaidDens — modCompileOnly so Loom remaps intermediary for hierarchy resolution
    modCompileOnly "maven.modrinth:cobblemonraiddens:d8mGjw4X" // Raid Dens 0.4.7 (fabric)

    // Academy (StarAcademy) — for the SlingshotEntity mixin (uncatchable boss
    // protection). Not published on Modrinth, so it has to come from localdeps/.
    modCompileOnly files(academyJar)

    // EnhancedCelestials — for the lunar fallback mixin (cheeseguard:* dims inherit arkensia settings)
    modCompileOnly "maven.modrinth:enhanced-celestials:WU6cJeLI" // Enhanced Celestials 6.0.2.5 (fabric)
    // DataAnchor — superclass of EnhancedCelestialsLunarForecastWorldData (SyncedLevelTrackedData)
    modCompileOnly "maven.modrinth:data-anchor:CpSbR8Mk" // Data Anchor 2.0.0.12 (fabric)

    // DaycarePlus — for IV inheritance mixin (competitive mode vanilla IVs)
    compileOnly "maven.modrinth:daycareplus:HqAFvLN2" // Daycare+ 1.1.0 (fabric)

    // fightorflight — modCompileOnly so Loom remaps intermediary→yarn for hierarchy
    modCompileOnly "maven.modrinth:cobblemon-fight-or-flight-reborn:6McAEN1y" // Fight or Flight 0.9.0 (fabric)

    // ExtraQuests + FTB Quests — modCompileOnly for hierarchy resolution
    modCompileOnly "maven.modrinth:extraquests:bbzqP178" // ExtraQuests 1.5.3 (fabric)
    modCompileOnly files("../localdeps/ftb-quests-fabric-2101.1.13.jar")

    // sgui — extracted from DaycarePlus JiJ, needed for DaycareGUIToggleMixin
    // modCompileOnly so Loom remaps intermediary → yarn (sgui API uses Item/ItemStack)
    modCompileOnly "eu.pb4:sgui:1.6.1+1.21.1"

    // JourneyMap (client-only) — for EntityHelper getIconData mixin to fix Seavlian fakemon icons
    // JourneyMap 1.21.1-6.0.0-beta.47 (fabric). Pinned to beta.47 on purpose: the
    // 6.0.0 release was built with Loom 1.14.10, which this project's Loom 1.10.5
    // refuses to read.
    modCompileOnly "maven.modrinth:journeymap:oBV1MaLz"

    // numismatic-overhaul — for the ShopBlockEntityRender distance-cull mixin (client-only FPS opt)
    compileOnly "maven.modrinth:numismatic-overhaul:DPXG6kTJ" // Numismatic Overhaul 0.3.4

    // Kotlin stdlib — needed to compile against Cobblemon's Kotlin classes
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"

    implementation 'com.google.code.gson:gson:2.10.1'
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
