plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // CheeseGuard — required (dimensions, managers). Present at runtime as a separate mod.
    modCompileOnly files(fileTree(dir: "../CheeseGuard/build/libs", includes: ["cheeseguard-*.jar"], excludes: ["*-sources.jar", "*-dev.jar"]))
    // CheeseDash — required for dashboard integration. Present at runtime.
    modCompileOnly files(fileTree(dir: "../CheeseDash/build/libs", includes: ["cheesedash-*.jar"], excludes: ["*-sources.jar", "*-dev.jar"]))

    // All other integrations (CobbleShift, CobbleCap, CobbleSafari/CheeseCompatModsFix,
    // CheeseItems, CheeseStore, Cobblemon, CobblemonRaidDens, EasyNPC) are accessed via
    // reflection hooks — no compile-time dependency, graceful fallback if absent.

    implementation 'com.google.code.gson:gson:2.10.1'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
